apiVersion: apps/v1
kind: Deployment
metadata:
  name: redbus-frontend
  namespace: default
  labels:
    app: redbus-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: redbus-frontend
  template:
    metadata:
      labels:
        app: redbus-frontend
    spec:
      containers:
      - name: frontend
        # Jenkins replaces both placeholders with the exact ECR repo URL and build tag
        image: ${ECR_FRONTEND_REPOSITORY}:${IMAGE_TAG}
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        env:
        # nginx proxies /v1/api to the in-cluster backend service.
        - name: BACKEND_HOST
          value: "redbus-backend"
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "200m"
            memory: "256Mi"
