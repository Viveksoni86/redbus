apiVersion: apps/v1
kind: Deployment
metadata:
  name: redbus-frontend
  namespace: default
  labels:
    app: redbus-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: redbus-frontend
  template:
    metadata:
      labels:
        app: redbus-frontend
    spec:
      containers:
      - name: frontend
        # Jenkins will dynamically replace this placeholder with the exact ECR repository URL and tag
        image: ${ECR_FRONTEND_REPOSITORY}:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "200m"
            memory: "256Mi"
